<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00f3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BreachOS">
  <meta name="description" content="A cyberpunk-themed memory card game. Match operatives, earn XP, unlock ranks and skins, and sync progress across all devices.">
  <link rel="canonical" href="https://breachos.laddtnov.xyz/">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png"     href="icons/icon-192.png">
  <title>Breachos</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/skins.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/combo.css">
  <link rel="stylesheet" href="css/achievements.css">
  <link rel="stylesheet" href="css/dossier.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/konami.css">
  <link rel="stylesheet" href="css/sound-themes.css">
  <link rel="stylesheet" href="css/collections.css">
  <link rel="stylesheet" href="css/survival.css">
  <link rel="stylesheet" href="css/daily.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/leaderboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/gameplay-mods.css">
  <link rel="stylesheet" href="css/quests.css">
  <link rel="stylesheet" href="css/colorblind.css">
  <link rel="stylesheet" href="css/weekly.css">
</head>

<body>
  <!-- Skip navigation — first focusable element, visually hidden until focused (#57) -->
  <a href="#game-board" class="skip-link">Skip to game</a>

  <!-- SR live region — game events announced to screen readers (#29) -->
  <div id="sr-announce" aria-live="assertive" aria-atomic="true" class="sr-only"></div>

  <!-- Partials — each file lives in partials/ for easy editing -->
  <div data-partial="partials/rules-modal.html"></div>
  <div data-partial="partials/mobile-menu.html"></div>
  <div data-partial="partials/controls.html"></div>
  <div data-partial="partials/skin-modal.html"></div>
  <div data-partial="partials/dossier-modal.html"></div>
  <div data-partial="partials/theme-modal.html"></div>
  <div data-partial="partials/sound-theme-modal.html"></div>
  <div data-partial="partials/achievement-modal.html"></div>
  <div data-partial="partials/collection-modal.html"></div>
  <div data-partial="partials/auth-modal.html"></div>
  <div data-partial="partials/leaderboard-modal.html"></div>
  <div data-partial="partials/quests-modal.html"></div>

  <!-- Onboarding — shown once to first-time players; <dialog> for native focus trap (WCAG 2.1.2 / #51) -->
  <dialog id="onboarding-modal" aria-label="How to play — onboarding">
    <div class="onboarding-content">
      <div class="onboarding-step" id="onboarding-step-0">
        <div class="onboarding-demo">
          <div class="demo-card demo-flip">?</div>
        </div>
        <h2 class="onboarding-title">CLICK ANY CARD</h2>
        <p class="onboarding-desc">Reveal a hidden operative beneath each tile</p>
      </div>
      <div class="onboarding-step hidden" id="onboarding-step-1">
        <div class="onboarding-demo onboarding-demo-pair">
          <div class="demo-card demo-matched">⚡</div>
          <div class="demo-card demo-matched">⚡</div>
        </div>
        <h2 class="onboarding-title">FIND THE MATCH</h2>
        <p class="onboarding-desc">Pairs stay revealed. Mismatches flip back after 1s.</p>
      </div>
      <div class="onboarding-step hidden" id="onboarding-step-2">
        <div class="onboarding-demo">
          <div class="demo-combo">5× COMBO</div>
        </div>
        <h2 class="onboarding-title">BUILD COMBOS</h2>
        <p class="onboarding-desc">Chain matches to earn XP, trigger Time Warp, and climb ranks</p>
      </div>
      <div class="onboarding-nav">
        <button id="onboarding-prev" class="hidden" onclick="onboardingPrev()" aria-label="Previous step">◀</button>
        <div class="onboarding-dots" role="tablist" aria-label="Onboarding steps">
          <span class="onboarding-dot active" id="dot-0" role="tab" aria-selected="true" aria-label="Step 1"></span>
          <span class="onboarding-dot" id="dot-1" role="tab" aria-selected="false" aria-label="Step 2"></span>
          <span class="onboarding-dot" id="dot-2" role="tab" aria-selected="false" aria-label="Step 3"></span>
        </div>
        <button id="onboarding-next" onclick="onboardingNext()" aria-label="Next step">▶</button>
      </div>
      <button id="onboarding-start" class="hidden" onclick="completeOnboarding()"><span aria-hidden="true">▶</span> START MISSION</button>
      <button id="onboarding-skip" onclick="completeOnboarding()">SKIP</button>
    </div>
  </dialog>

  <!-- Page title for AT — visually hidden, preserves neon design (#43) -->
  <h1 class="sr-only">Breachos</h1>

  <div class="cyber-table">
    <div data-partial="partials/game-area.html"></div>
  </div>

  <script src="js/load-partials.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/haptics.js"></script>
  <script src="js/data.js"></script>
  <script src="js/rank.js"></script>
  <script src="js/game.js"></script>
  <script src="js/collections.js"></script>
  <script src="js/dossier.js"></script>
  <script src="js/sound-themes.js"></script>
  <script src="js/konami.js"></script>
  <script src="js/share.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/survival-rules.js"></script>
  <script src="js/survival.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/weekly.js"></script>
  <script src="js/login-streak.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/quests.js"></script>
  <script type="module">
    await loadPartials();
    initDOMRefs();
    renderSkinModal();
    initMenuDialog();
    updateRankHUD();
    updateBestTimes();
    if (typeof updateDailyButton === 'function') updateDailyButton();
    if (typeof updateWeeklyButton === 'function') updateWeeklyButton();
    if (typeof updateQuestsHUD === 'function') updateQuestsHUD();
    if (typeof initColorBlind === 'function') initColorBlind();
    if (typeof initFlipAnimations === 'function') initFlipAnimations();
    if (typeof processLoginStreak === 'function') processLoginStreak();
    syncSoundButton();
    initOnboarding();
    initGame();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>

</html>
