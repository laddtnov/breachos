name: Checks

# Deployment is handled by Vercel's Git integration, which builds every push to
# main and every pull request branch on its own. This workflow used to deploy as
# well, which meant two production builds of the same commit for every merge —
# confirmed in the deployment history, roughly 25 seconds apart. All that is
# left here is the check.
on:
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    name: Build Check
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm ci installs exactly what package-lock.json resolves, so CI cannot
      # silently pick up a different transitive version than the one reviewed.
      # --ignore-scripts blocks package lifecycle hooks; verified that esbuild
      # still works under it, as it ships platform binaries as optional
      # dependencies rather than downloading one from a postinstall hook.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      # This step used to be `npm run build 2>/dev/null || echo "No build
      # script"`, which was harmless while the project had none. It does now,
      # and that form would have reported a green build check for a build that
      # failed.
      - name: Build
        id: build
        run: npm run build

      - name: Comment on PR
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Breach OS build check passed! Ready to merge → breachos.laddtnov.xyz'
            })
