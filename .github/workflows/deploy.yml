name: Deploy Breach OS to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build Check
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm ci installs exactly what package-lock.json resolves, so CI cannot
      # silently pick up a different transitive version than the one reviewed.
      # --ignore-scripts blocks package lifecycle hooks; verified that esbuild
      # still works under it, as it ships platform binaries as optional
      # dependencies rather than downloading one from a postinstall hook.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      # This step used to be `npm run build 2>/dev/null || echo "No build
      # script"`, which was harmless while the project had none. It does now,
      # and that form would have reported a green build check for a build that
      # failed.
      - name: Build
        id: build
        run: npm run build

      - name: Comment on PR
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Breach OS build check passed! Ready to merge → breachos.laddtnov.xyz'
            })

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to Vercel
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pinned rather than floating: this CLI holds a deploy token, so the
      # version that runs should be one that was reviewed, not whatever
      # published most recently. Bump deliberately.
      # --ignore-scripts blocks lifecycle hooks during install; verified the
      # CLI still runs under it.
      - name: Deploy Breach OS
        run: |
          npm install -g vercel@59.3.0 --ignore-scripts
          vercel deploy --prod --token=$VERCEL_TOKEN --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: ✅ Deployment Success
        run: echo "🎮 Breach OS live at breachos.laddtnov.xyz"

      - name: ❌ Deployment Failed
        if: failure()
        run: echo "Check logs above"
