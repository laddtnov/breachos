<!-- Leaderboard Modal -->
<dialog id="leaderboard-modal" aria-label="Neural Rankings">
  <div class="lb-modal-content">

    <h2 class="lb-title">NEURAL RANKINGS</h2>
    <div class="lb-divider"></div>

    <!-- Tabs -->
    <div class="lb-tabs" role="tablist" aria-label="Leaderboard view">
      <button class="lb-tab active" role="tab" aria-selected="true" data-tab="global" onclick="switchLeaderboardTab('global')">GLOBAL XP</button>
      <button class="lb-tab" role="tab" aria-selected="false" data-tab="daily" onclick="switchLeaderboardTab('daily')">TODAY</button>
    </div>

    <ol id="leaderboard-list" class="lb-list" aria-live="polite" aria-label="Leaderboard entries">
      <!-- populated by leaderboard.js -->
    </ol>

    <p id="leaderboard-updated" class="lb-updated"></p>

    <div class="lb-actions">
      <button class="lb-refresh-btn" onclick="refreshLeaderboard()">↺ REFRESH</button>
      <button class="lb-close-btn" onclick="document.getElementById('leaderboard-modal').close()">CLOSE</button>
    </div>

  </div>
</dialog>
