<!-- Leaderboard Modal -->
<dialog id="leaderboard-modal" aria-label="Neural Rankings">
  <div class="lb-modal-content">

    <h2 class="lb-title">NEURAL RANKINGS</h2>
    <p class="lb-subtitle">TOP 10 NETRUNNERS</p>
    <div class="lb-divider"></div>

    <ol id="leaderboard-list" class="lb-list">
      <!-- populated by leaderboard.js -->
    </ol>

    <p id="leaderboard-updated" class="lb-updated"></p>

    <div class="lb-actions">
      <button class="lb-refresh-btn" onclick="invalidateLeaderboardCache(); fetchLeaderboard().then(renderLeaderboard).catch(()=>renderLeaderboard(null))">
        ↺ REFRESH
      </button>
      <button class="lb-close-btn" onclick="document.getElementById('leaderboard-modal').close()">
        CLOSE
      </button>
    </div>

  </div>
</dialog>
