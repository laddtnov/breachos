<!-- Achievement Modal -->
<div id="achievement-modal" class="hidden">
  <div class="achievement-modal-content">
    <h3 class="achievement-modal-title">ACHIEVEMENTS</h3>
    <div class="rules-divider"></div>
    <p class="achievement-count" id="achievement-count">UNLOCKED: <span>0</span> / 6</p>
    <div id="achievement-grid"></div>
    <button class="achievement-close-btn" onclick="toggleAchievementModal()">CLOSE</button>
  </div>
</div>

<!-- Achievement Popup -->
<div id="achievement-popup" class="hidden">
  <span class="achievement-symbol"></span>
  <div>
    <div class="achievement-label">ACHIEVEMENT UNLOCKED</div>
    <div class="achievement-name"></div>
    <div class="achievement-desc"></div>
  </div>
</div>
