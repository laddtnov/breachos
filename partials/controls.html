<!-- Controls (desktop) — seven destinations. Preferences live in SETTINGS, and
     skins / table themes / sound themes share the CUSTOMISE modal. -->
<div class="controls">
  <button id="dossier-btn" onclick="toggleDossierModal()">PROFILE</button>
  <button id="customise-btn" onclick="toggleCustomiseModal()">CUSTOMISE</button>
  <button id="leaderboard-btn" onclick="toggleLeaderboardModal()">RANKINGS</button>
  <button id="quests-btn" onclick="toggleQuestsModal()">QUESTS<span class="quest-dot hidden" id="quests-dot"></span></button>
  <button id="settings-btn" onclick="toggleSettingsModal()">SETTINGS</button>
  <button id="sync-btn" onclick="toggleAuthModal()">SYNC</button>
  <button id="support-btn" onclick="window.open('https://buymeacoffee.com/laddtnov','_blank','noopener')">SUPPORT</button>
</div>
