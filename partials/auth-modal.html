<!-- Auth / Sync Modal -->
<dialog id="auth-modal" aria-label="Sync account">
  <div class="auth-modal-content">
    <h2 class="auth-modal-title">NETRUNNER ID</h2>
    <p class="auth-modal-sub">SYNC PROGRESS ACROSS ALL DEVICES</p>
    <div class="auth-divider"></div>

    <!-- ── Logged Out ── -->
    <div id="auth-logged-out">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="signup" onclick="switchAuthTab('signup')">SIGN UP</button>
        <button class="auth-tab" data-tab="login" onclick="switchAuthTab('login')">LOG IN</button>
      </div>

      <!-- Sign Up -->
      <div id="auth-signup-panel">
        <div class="auth-field">
          <label class="auth-label" for="reg-username">USERNAME</label>
          <input type="text" id="reg-username" class="auth-input"
                 placeholder="NETRUNNER_X" maxlength="20" autocomplete="username" />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="reg-email">EMAIL</label>
          <input type="email" id="reg-email" class="auth-input"
                 placeholder="agent@net.run" autocomplete="email" />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="reg-password">PASSWORD</label>
          <input type="password" id="reg-password" class="auth-input"
                 placeholder="MIN 6 CHARS" autocomplete="new-password" />
        </div>
        <p class="auth-error" id="reg-error"></p>
        <button class="auth-submit-btn" id="reg-btn" onclick="handleRegister()">SIGN UP</button>
        <p class="auth-notice">Progress syncs automatically once you register. Unregistered players are unaffected.</p>
      </div>

      <!-- Log In -->
      <div id="auth-login-panel" class="hidden">
        <div class="auth-field">
          <label class="auth-label" for="login-email">EMAIL</label>
          <input type="email" id="login-email" class="auth-input"
                 placeholder="agent@net.run" autocomplete="email" />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="login-password">PASSWORD</label>
          <input type="password" id="login-password" class="auth-input"
                 placeholder="PASSWORD" autocomplete="current-password" />
        </div>
        <p class="auth-error" id="login-error"></p>
        <button class="auth-submit-btn" id="login-btn" onclick="handleLogin()">LOG IN</button>
      </div>
    </div>

    <!-- ── Logged In ── -->
    <div id="auth-logged-in" class="hidden">
      <p class="auth-operative-label">OPERATIVE</p>
      <p class="auth-username-display" id="auth-username-display"></p>
      <p class="auth-sync-note">Progress syncs automatically after each game.</p>
      <button class="auth-sync-now-btn" id="manual-sync-btn" onclick="handleManualSync()">SYNC NOW</button>
      <button class="auth-logout-btn" onclick="authLogout(); renderAuthModal()">LOG OUT</button>
    </div>

    <button class="auth-close-btn" onclick="toggleAuthModal()">CLOSE</button>
  </div>
</dialog>
