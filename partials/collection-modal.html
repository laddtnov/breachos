<!-- Collection Modal -->
<dialog id="collection-modal">
  <div class="collection-modal-content">
    <h3 class="collection-modal-title">COLLECTION</h3>
    <p class="collection-subtitle">RANK REWARD CARDS</p>
    <div class="rules-divider"></div>
    <p class="collection-count" id="collection-count">COLLECTED: <span>0</span> / 5</p>
    <div id="collection-grid"></div>
    <button class="collection-close-btn" onclick="toggleCollectionModal()">CLOSE</button>
  </div>
</dialog>

<!-- Rank Up Overlay -->
<div id="rankup-overlay" class="hidden">
  <div class="rankup-content">
    <h2 class="rankup-label">RANK UP!</h2>
    <p class="rankup-name" id="rankup-name">AGENT</p>
  </div>
</div>
