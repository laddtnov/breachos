<!-- Menu Trigger (mobile) -->
<button id="menu-btn" onclick="toggleMenu()" aria-label="Open menu">
  <span class="menu-icon"></span>
  <span class="menu-icon"></span>
  <span class="menu-icon"></span>
</button>

<!-- Menu Dialog (mobile) -->
<dialog id="menu-dialog" aria-label="Game menu">
  <div class="menu-panel">
    <button class="menu-close-btn" onclick="toggleMenu()" aria-label="Close menu">&times;</button>
    <div class="menu-title">SYSTEM MENU</div>
    <div class="menu-divider"></div>
    <div class="menu-buttons">
      <button class="menu-item" onclick="toggleEffects(); toggleMenu()">
        STATUS: <span id="status-text-mobile">CYBER MODE</span>
      </button>
      <button class="menu-item" onclick="toggleColorBlind(); toggleMenu()" aria-pressed="false">
        COLOR BLIND: <span id="cb-status-mobile">OFF</span>
      </button>
      <button class="menu-item" onclick="toggleFlipAnimations(); toggleMenu()" aria-pressed="true">
        CARD FLIP: <span id="flip-status-mobile">ON</span>
      </button>
      <button class="menu-item" id="sound-toggle-mobile" onclick="SoundEngine.toggle()">SOUND: ON</button>
      <button class="menu-item" id="haptic-toggle-mobile" onclick="Haptics.toggle()">HAPTICS: ON</button>
      <button class="menu-item" onclick="toggleSkinModal(); toggleMenu()">SKINS</button>
      <button class="menu-item" onclick="toggleCollectionModal(); toggleMenu()">COLLECTION</button>
      <button class="menu-item" onclick="toggleAchievementModal(); toggleMenu()">ACHIEVEMENTS</button>
      <button class="menu-item" onclick="toggleDossierModal(); toggleMenu()">DOSSIER</button>
      <button class="menu-item" onclick="toggleThemeModal(); toggleMenu()">THEMES</button>
      <button class="menu-item" onclick="toggleSoundThemeModal(); toggleMenu()">SOUNDS</button>
      <button class="menu-item" onclick="toggleLeaderboardModal()">RANKINGS</button>
      <button class="menu-item" onclick="toggleQuestsModal(); toggleMenu()">QUESTS</button>
      <button class="menu-item menu-item-sync" id="sync-btn-mobile" onclick="toggleAuthModal()">SYNC</button>
      <button class="menu-item menu-item-support" onclick="window.open('https://buymeacoffee.com/laddtnov','_blank','noopener'); toggleMenu()">SUPPORT</button>
    </div>
  </div>
</dialog>
