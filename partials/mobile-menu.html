<!-- Menu Trigger (mobile) -->
<button id="menu-btn" onclick="toggleMenu()" aria-label="Open menu">
  <span class="menu-icon"></span>
  <span class="menu-icon"></span>
  <span class="menu-icon"></span>
</button>

<!-- Menu Dialog (mobile) -->
<dialog id="menu-dialog" class="menu-panel" aria-label="Game menu">
  <button class="menu-close-btn" onclick="toggleMenu()" aria-label="Close menu">&times;</button>
  <div class="menu-title">SYSTEM MENU</div>
  <div class="menu-divider"></div>
  <div class="menu-buttons">
    <button class="menu-item" onclick="toggleEffects(); toggleMenu()">
      STATUS: <span id="status-text-mobile">CYBER MODE</span>
    </button>
    <button class="menu-item" onclick="SoundEngine.toggle(); toggleMenu()">SOUND</button>
    <button class="menu-item" onclick="toggleSkinModal(); toggleMenu()">SKINS</button>
    <button class="menu-item" onclick="toggleCollectionModal(); toggleMenu()">COLLECTION</button>
    <button class="menu-item" onclick="toggleAchievementModal(); toggleMenu()">ACHIEVEMENTS</button>
    <button class="menu-item" onclick="toggleDossierModal(); toggleMenu()">DOSSIER</button>
    <button class="menu-item" onclick="toggleThemeModal(); toggleMenu()">THEMES</button>
    <button class="menu-item" onclick="toggleSoundThemeModal(); toggleMenu()">SOUNDS</button>
    <button class="menu-item menu-item-donate" onclick="toggleDonateModal(); toggleMenu()">DONATE</button>
  </div>
</dialog>
